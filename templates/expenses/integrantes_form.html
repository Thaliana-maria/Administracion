<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Agregar integrantes</title>
</head>
<body>
    <h1>Agregar integrantes a {{ grupo.nombre }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ formulario.non_field_errors }}
        {{ formulario.as_p }}
        <button type="submit">Agregar integrantes</button>
    </form>
    <p><a href="{% url 'detalle_grupo' grupo.pk %}">Volver al grupo</a></p>
</body>
</html>
