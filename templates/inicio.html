<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quién gastó esto?</title>
</head>
<body>
    <h1>¿Quién gastó esto?</h1>
    {% if user.is_authenticated %}
        <p>Bienvenido, {{ user.email }}</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
        </form>
    {% else %}
        <p><a href="{% url 'login' %}">Iniciar sesión</a></p>
        <p><a href="{% url 'registro' %}">Crear cuenta</a></p>
    {% endif %}
</body>
</html>
